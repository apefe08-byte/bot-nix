name: Bot Nix

on:
  schedule:
    - cron: "*/20 * * * *"   # cada 20 minutos
  workflow_dispatch:          # botón para lanzarlo a mano
    inputs:
      modo:
        description: "normal / test (manda lo último) / dry-run (no envía)"
        default: "normal"

permissions:
  contents: write

concurrency:
  group: bot-nix
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ejecutar Bot Nix
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ vars.TELEGRAM_THREAD_ID }}
          PODCAST_RSS: ${{ vars.PODCAST_RSS }}
          BLOG_RSS: ${{ vars.BLOG_RSS }}
          SPOTIFY_URL: ${{ vars.SPOTIFY_URL }}
          APPLE_URL: ${{ vars.APPLE_URL }}
        run: |
          MODO="${{ github.event.inputs.modo || 'normal' }}"
          if [ "$MODO" = "test" ]; then python bot_nix.py --test
          elif [ "$MODO" = "dry-run" ]; then python bot_nix.py --dry-run
          else python bot_nix.py; fi

      - name: Guardar lo ya anunciado
        run: |
          git config user.name "Bot Nix"
          git config user.email "bot-nix@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Bot Nix: estado actualizado" && git push)
